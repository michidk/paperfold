name: Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Check for dead code
        run: bun run lint:deadcode

      - name: Check database migrations match the schema
        run: |
          bun run db:generate
          changes="$(git status --porcelain --untracked-files=all -- drizzle)"
          if [ -n "$changes" ]; then
            echo "Schema changes require a committed migration:"
            echo "$changes"
            exit 1
          fi

      - name: Build client
        run: bun run build
