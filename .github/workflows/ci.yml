name: Checks and Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint
        run: bun run check

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Check for dead code
        run: bun run lint:deadcode

      - name: Check database migrations match the schema
        run: |
          bun run db:generate
          changes="$(git status --porcelain --untracked-files=all -- drizzle)"
          if [ -n "$changes" ]; then
            echo "Schema changes require a committed migration:"
            echo "$changes"
            exit 1
          fi

      - name: Build client
        run: bun run build

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build native image for runtime checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: paperfold:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify container HTTP, WebSocket and persistent storage
        run: bash scripts/smoke-image.sh paperfold:smoke

  image:
    needs: container-smoke
    uses: michidk/workflows/.github/workflows/container-image.yml@f44c0a5eb5b7bb908bc28084f390195102308b46 # main
    permissions:
      contents: read
      packages: write
